name: Sync GitCode

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push main to GitCode
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          git fetch origin main
          git reset --hard origin/main
          for attempt in 1 2 3; do
            if git push "https://wsrlikemc:${GITCODE_TOKEN}@gitcode.com/wsrlikemc/SilentCraft-Launcher.git" +HEAD:main --force; then
              exit 0
            fi
            sleep 3
          done
          exit 1